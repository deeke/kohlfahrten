# Hilfsfunktion: lädt die in bilder/urls.txt gelisteten Bilder (von der alten Google-Seite)
# herunter und legt sie als bilder/orig/<name>.jpg ins Repository.
name: Bilder holen
on:
  push:
    branches: [main]
    paths: ['bilder/urls.txt']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Herunterladen
        run: |
          mkdir -p bilder/orig
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          for page in startseite bollerwagen strecken gastst%C3%A4tten spiele shop; do
            curl -sSL -A "$UA" -c /tmp/cj -b /tmp/cj "https://sites.google.com/view/kohlfahrten-de/$page" -o /tmp/page.html || continue
            short=$(echo "$page" | sed 's/%C3%A4/ae/')
            n=0
            for url in $(grep -oE 'https://sites\.google\.com/sitesv-images-rt/[A-Za-z0-9_-]+' /tmp/page.html | sort -u); do
              n=$((n+1)); name="${short}-$(printf %02d $n)"
              curl -sSL --fail -A "$UA" -b /tmp/cj -e "https://sites.google.com/view/kohlfahrten-de/$page" -o "/tmp/$name" "${url}=w1600" || { echo "::warning::$name fehlgeschlagen"; continue; }
              cp "/tmp/$name" "bilder/orig/$name.bin"
            done
            echo "$page: $n Bilder"
          done
          ls -la bilder/orig
      - name: Einchecken
        run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add bilder/orig
          git diff --cached --quiet || git commit -m "Bilder von der Google-Seite übernommen"
          git push
