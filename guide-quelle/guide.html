/* 2 Intro */
H+=`<section class="page">${hdr()}<span class="kicker"><i class="fa-solid fa-leaf"></i> Willkommen</span><h2>Was ist eigentlich eine Kohlfahrt?</h2>
<p class="lead">Die Kohlfahrt (auch Kohltour oder Grünkohlwanderung) ist <b>die</b> Wintertradition im Nordwesten: Eine Gruppe zieht mit Bollerwagen, Boßelkugel und Schnapsglas am Band über Land – und landet am Ende in einer Gaststätte beim großen Grünkohlessen. Dort wird gefeiert, getanzt und das neue Kohlkönigspaar gekrönt.</p>
<div class="bigfact"><div><i class="fa-solid fa-snowflake"></i><b>Nov – März</b><span>Kohlfahrt-Saison</span></div><div><i class="fa-solid fa-person-hiking"></i><b>3 – 8 km</b><span>typische Strecke</span></div><div><i class="fa-solid fa-users"></i><b>10 – 40</b><span>Personen pro Gruppe</span></div><div><i class="fa-solid fa-crown"></i><b>1 Paar</b><span>Kohlkönig & -königin</span></div></div>
<div class="grid2"><div class="box"><h3><span class="ic"><i class="fa-solid fa-utensils"></i></span>Grünkohl & Co.</h3><p>Traditionell gibt es Grünkohl mit Pinkel, Kassler und Kochwurst, dazu Salz- oder Bratkartoffeln. Viele Häuser bieten inzwischen auch vegetarische oder vegane Varianten an.</p></div>
<div class="box"><h3><span class="ic am"><i class="fa-solid fa-bowling-ball"></i></span>Boßeln unterwegs</h3><p>Gerade im Emsland, in Ostfriesland und im Oldenburger Land gehört Boßeln fest dazu: Zwei Teams werfen die Kugel um die Wette über die Strecke.</p></div></div>
<h3 style="margin-top:7mm">Inhalt</h3><ul class="toc">
<li><i class="fa-solid fa-calendar-check"></i>Planung Schritt für Schritt<span>3</span></li>
<li><i class="fa-solid fa-suitcase"></i>Die Packliste<span>4</span></li>
<li><i class="fa-solid fa-trailer"></i>Strecke, Bollerwagen & Sicherheit<span>5</span></li>
<li><i class="fa-solid fa-dice"></i>${GAMES.length} Kohlfahrt-Spiele<span>6</span></li>
<li><i class="fa-solid fa-crown"></i>Kohlkönig & Kohlkönigin<span>10</span></li>
<li><i class="fa-solid fa-store"></i>Ausrüstung von bossel.de<span>11</span></li></ul>
${foot()}</section>`;
/* 3 Planung */
H+=`<section class="page">${hdr()}<span class="kicker"><i class="fa-solid fa-calendar-check"></i> Planung</span><h2>In 5 Schritten zur Kohlfahrt</h2>
<div class="tl">
<div class="st"><div class="when">8–12 Wochen vorher</div><b>Termin & Gaststätte festmachen</b><ul><li>Beliebte Samstage im Januar und Februar sind früh ausgebucht – rechtzeitig anfragen.</li><li>Preis p. P., Leistungen (Essen, Getränke, Musik, Saal) und Endzeit klären.</li><li>Gaststätten mit Kohlfahrt- und Boßelangeboten findet ihr auf <b>kohlfahrten.de</b>.</li></ul></div>
<div class="st"><div class="when">6 Wochen vorher</div><b>Strecke & Bollerwagen</b><ul><li>Strecke mit Ziel an der Gaststätte wählen – 3 bis 8 km reichen völlig.</li><li>Bollerwagen leihen oder kaufen, Musikbox, Licht und Regenschutz einplanen.</li></ul></div>
<div class="st"><div class="when">4 Wochen vorher</div><b>Einladung & Kasse</b><ul><li>Teilnehmerliste, Kostenbeitrag einsammeln, Treffpunkt und Uhrzeit festlegen.</li><li>Gruppen-Schnapsgläser mit Druck jetzt bestellen – sie brauchen etwas Vorlauf.</li></ul></div>
<div class="st"><div class="when">1 Woche vorher</div><b>Spiele & Material</b><ul><li>4–6 Spiele auswählen, Material besorgen, Stationen auf der Strecke planen.</li><li>Heimweg organisieren: Taxi, Sammelbus oder Shuttle der Gaststätte.</li></ul></div>
<div class="st"><div class="when">Am Tag</div><b>Los geht's!</b><ul><li>Warnwesten an, Bollerwagen beladen, Musik an – und ab auf die Strecke.</li><li>Unterwegs Müll mitnehmen und Rücksicht auf Anwohner und Verkehr nehmen.</li></ul></div>
</div>
<h3 style="margin:2mm 0 3mm">Wer macht was?</h3>
<div class="roles"><div class="role"><span class="ic"><i class="fa-solid fa-clipboard-list"></i></span><b>Organisator</b><span>Termin, Gaststätte, Strecke</span></div>
<div class="role"><span class="ic am"><i class="fa-solid fa-coins"></i></span><b>Kassenwart</b><span>Beiträge & Einkäufe</span></div>
<div class="role"><span class="ic sk"><i class="fa-solid fa-dice"></i></span><b>Spielleiter</b><span>Spiele & Punkte</span></div>
<div class="role"><span class="ic br"><i class="fa-solid fa-trailer"></i></span><b>Wagenchef</b><span>Bollerwagen & Getränke</span></div></div>
${foot()}</section>`;
/* 4 Packliste */
H+=`<section class="page">${hdr()}<span class="kicker"><i class="fa-solid fa-suitcase"></i> Packliste</span><h2>Alles dabei?</h2>
<p class="lead">Zum Abhaken: Damit unterwegs nichts fehlt – vom Bollerwagen bis zum Pflaster.</p>
<div class="pack">
<div class="box"><h3><span class="ic br"><i class="fa-solid fa-trailer"></i></span>Bollerwagen</h3><ul><li>Bollerwagen mit Luftreifen</li><li>Plane / Regendach</li><li>Musikbox (Akku geladen!)</li><li>Getränkekisten & Kühlbox</li><li>Becher, Flaschenöffner</li><li>Müllbeutel</li></ul></div>
<div class="box"><h3><span class="ic am"><i class="fa-solid fa-whiskey-glass"></i></span>Für jede Person</h3><ul><li class="ad">Schnapsglas am Band</li><li class="ad">Keramik-Schnapsglas mit Motiv</li><li>Warme, wasserfeste Kleidung</li><li>Feste Schuhe</li><li>Ausweis, etwas Bargeld</li><li>Handy mit Akku</li></ul></div>
<div class="box"><h3><span class="ic"><i class="fa-solid fa-bowling-ball"></i></span>Spiele</h3><ul><li class="ad">Boßelkugeln & Kescher</li><li>Material für die Spiele (S. 6–9)</li><li>Kreide, Maßband, Stoppuhr</li><li>Punktezettel & Stift</li><li class="ad">Kohlkönig-Krone & Orden</li></ul></div>
<div class="box"><h3><span class="ic sk"><i class="fa-solid fa-shield-halved"></i></span>Sicherheit</h3><ul><li class="ad">Warnwesten für alle</li><li>Taschenlampe / Stirnlampen</li><li>Erste-Hilfe-Set</li><li>Nummer von Taxi & Gaststätte</li><li>Wasser & Snacks</li></ul></div>
</div>
${ad(AD('band'),'qr_bossel.svg')}
${foot()}</section>`;
/* 5 Strecke & Sicherheit */
H+=`<section class="page">${hdr()}<span class="kicker"><i class="fa-solid fa-route"></i> Unterwegs</span><h2>Strecke, Bollerwagen & Sicherheit</h2>
<div class="grid2">
<div class="box"><h3><span class="ic"><i class="fa-solid fa-map-location-dot"></i></span>Die richtige Strecke</h3><p>Ideal sind ruhige Nebenstraßen und Wirtschaftswege mit festem Untergrund – da rollt Bollerwagen und Kugel. Plant Pausen-Stationen für die Spiele ein und lasst die Strecke an der Gaststätte enden.</p><p class="note"><i class="fa-solid fa-circle-info"></i> Fertige Kohlfahrt-Strecken mit Karte findet ihr auf kohlfahrten.de.</p></div>
<div class="box"><h3><span class="ic br"><i class="fa-solid fa-trailer"></i></span>Der Bollerwagen</h3><p>Luftreifen, eine Feststellbremse und eine Plane machen das Leben leicht. Viele Verleiher liefern den Wagen direkt zum Start – einige Gaststätten stellen sogar bestückte Wagen.</p><p>Ein Wagen reicht für ca. 10–15 Personen.</p></div>
<div class="box"><h3><span class="ic am"><i class="fa-solid fa-bowling-ball"></i></span>Boßelregeln kompakt</h3><ul class="rules"><li>Zwei Teams, gleiche Startlinie.</li><li>Es wirft das Team, dessen Kugel zurückliegt.</li><li>Gewertet wird, wo die Kugel liegen bleibt.</li><li>Wer mit weniger Würfen am Ziel ist, gewinnt.</li></ul></div>
<div class="box"><h3><span class="ic sk"><i class="fa-solid fa-shield-halved"></i></span>Sicher unterwegs</h3><ul class="rules"><li>Warnwesten tragen – im Winter wird es früh dunkel.</li><li>Nie werfen, wenn Fahrzeuge oder Fußgänger kommen.</li><li>Streckenposten mit Fahne vorn und hinten.</li><li>Wer fährt, trinkt nicht – Heimweg vorher planen.</li></ul></div>
</div>
<div class="tip warn"><i class="fa-solid fa-triangle-exclamation"></i><div><b>Rücksicht ist Ehrensache:</b> Boßeln auf öffentlichen Straßen ist nur dort erlaubt, wo der Verkehr nicht gefährdet wird. Müll gehört in den Bollerwagen – nicht in den Graben.</div></div>
${ad(AD('kugel'))}
${foot()}</section>`;

<p class="lead">Zum Abschluss jeder Kohlfahrt wird das neue Kohlkönigspaar gekrönt. Die Ehre ist groß – die Pflichten auch: Traditionell organisiert das Königspaar die Kohlfahrt im nächsten Jahr.</p>
